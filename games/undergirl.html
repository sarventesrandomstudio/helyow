const W = 640, H = 480;
const cv = document.getElementById('game');

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- Ölçekleme ---------------- */
let isTouch = ('ontouchstart' in window) || matchMedia('(pointer:coarse)').matches;
let RS = 1;
function resize() {
  const portrait = innerHeight > innerWidth;
  const availH = innerHeight - (isTouch && portrait ? 200 : 0);
  const s = Math.max(0.3, Math.min(innerWidth / W, availH / H));
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  const dpr = window.devicePixelRatio || 1;
  RS = clamp(Math.ceil(s * dpr), 1, 3);
  cv.width = W * RS; cv.height = H * RS;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.imageSmoothingEnabled = false;
  document.getElementById('wrap').style.alignItems = (isTouch && portrait) ? 'flex-start' : 'center';
  document.getElementById('wrap').style.paddingTop = (isTouch && portrait) ? '12px' : '0';

(function setupTouch() {
  const t = document.getElementById('touch');
  if (isTouch) t.classList.add('on');
  t.querySelectorAll('.tb').forEach(el => {
    const k = el.dataset.k;
    const dn = e => { e.preventDefault(); el.classList.add('down'); press(k); };
    const up = e => { e.preventDefault(); el.classList.remove('down'); release(k); };
    el.addEventListener('pointerdown', dn); el.addEventListener('pointerup', up);

const Snd = {

  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.7, this.ac.currentTime, 0.02); },
  throttle(name, gap) { const n = performance.now(); if (this.last[name] && n - this.last[name] < gap * 1000) return false; this.last[name] = n; return true; },

    g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(v, at + (attack || 0.005));

  tone(f, d, type = 'square', v = 0.15, o = {}) { if (!this.ac) return; this.osc(this.ac.currentTime + (o.when || 0), f, d, type, v, o.dest, o.slide, o.attack); },
  noiseAt(at, d, v, o = {}) {

};
const SFX = {

  dodge() { Snd.tone(520, 0.12, 'triangle', 0.07, { slide: 0.5 }); },
  hit() { Snd.noise(0.5, 0.32, { freq: 900 }); Snd.tone(90, 0.6, 'square', 0.14, { slide: 0.3 }); },
  flash() { Snd.tone(540, 0.07, 'square', 0.1); Snd.tone(1080, 0.05, 'square', 0.05); },
  crack() { Snd.tone(320, 0.1, 'square', 0.12, { slide: 0.6 }); Snd.noise(0.06, 0.18, { type: 'highpass', freq: 3000 }); },
  shatter() { Snd.noise(0.4, 0.25, { type: 'highpass', freq: 2200 }); [600, 450, 300].forEach((f, i) => Snd.tone(f, 0.15, 'square', 0.06, { when: i * 0.05, slide: 0.5 })); },
  spare() { [392, 523, 659, 784, 1046].forEach((f, i) => Snd.tone(f, 0.35, 'triangle', 0.1, { when: i * 0.09 })); },
  yawn() { Snd.tone(330, 0.7, 'sine', 0.08, { slide: 0.55, attack: 0.15 }); },

/* ---------------- Müzik (özgün besteler) ---------------- */
function NOTE(n) {
  const m = n.match(/^([A-G])(#|b)?(\d)$/);
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, ((+m[3] + 1) * 12 + base - 69) / 12);
}
function parseSeq(str) {
  const ev = []; let s = 0;
  str.trim().split(/\s+/).forEach(tok => { if (tok === '|') return; const [n, l] = tok.split(':'); if (n !== 'R') ev.push({ s, f: NOTE(n), len: +l }); s += +l; });
  return { ev, len: s };
}
function makeTrack(seq, inst, vol) { const p = parseSeq(seq); const map = {}; p.ev.forEach(e => (map[e.s] = map[e.s] || []).push(e)); return { map, len: p.len, inst, vol }; }
function chordTrack(chords, stepsPer, pattern, inst, vol, octUp) {
  // chords: array of note arrays; pattern: indices per step
  let str = '';
  chords.forEach(ch => { for (let i = 0; i < stepsPer; i++) { const idx = pattern[i % pattern.length]; str += (idx < 0 ? 'R' : ch[idx % ch.length]) + ':1 '; } });
  return makeTrack(str, inst, vol);
}
const INST = {
  lead(at, f, d, v) { Snd.osc(at, f, d * 0.95, 'square', v, Snd.music); Snd.osc(at, f * 1.005, d * 0.9, 'square', v * 0.35, Snd.music); },
  bass(at, f, d, v) { Snd.osc(at, f, d * 0.9, 'triangle', v, Snd.music); Snd.osc(at, f, d * 0.5, 'square', v * 0.18, Snd.music); },
  arp(at, f, d, v) { Snd.osc(at, f, Math.min(d, 0.12), 'square', v, Snd.music); },
  box(at, f, d, v) { Snd.osc(at, f, 1.3, 'sine', v, Snd.music, 0, 0.004); Snd.osc(at, f * 2, 0.6, 'sine', v * 0.25, Snd.music, 0, 0.004); Snd.osc(at, f * 3, 0.25, 'triangle', v * 0.08, Snd.music, 0, 0.004); },
  pad(at, f, d, v) { Snd.osc(at, f, d * 1.05, 'triangle', v, Snd.music, 0, 0.12); },
  kick(at, f, d, v) { Snd.osc(at, 160, 0.14, 'sine', v, Snd.music, 0.25); },
  snare(at, f, d, v) { Snd.noiseAt(at, 0.12, v, { type: 'bandpass', freq: 1900, q: 0.8, dest: Snd.music }); Snd.osc(at, 210, 0.06, 'triangle', v * 0.5, Snd.music); },
  hat(at, f, d, v) { Snd.noiseAt(at, 0.035, v, { type: 'highpass', freq: 7500, dest: Snd.music }); }
};
function drumTrack(bars, k, s, h) {
  const map = {}; let len = 16 * bars;
  for (let b = 0; b < bars; b++) for (let i = 0; i < 16; i++) {
    const st = b * 16 + i;
    if (k[i] === 'x') (map[st] = map[st] || []).push({ f: 0, len: 1, d: 'kick' });
    if (s[i] === 'x') (map[st] = map[st] || []).push({ f: 0, len: 1, d: 'snare' });
    if (h[i] === 'x') (map[st] = map[st] || []).push({ f: 0, len: 1, d: 'hat' });
  }
  return { map, len, inst: 'drum', vol: 1 };

const SONGS = {};
(function buildSongs() {
  // "Kemik Gibi Sağlam" — savaş teması (D minör, özgün)
  const lead = parseSeq.length && [
    'D5:2 D5:1 R:1 F5:2 A5:3 G5:1 F5:2 E5:2 D5:2',
    'F5:2 F5:1 R:1 D5:2 Bb4:2 C5:2 D5:4 R:2',
    'E5:2 E5:1 R:1 G5:2 C6:3 Bb5:1 A5:2 G5:2 E5:2',
    'A5:3 G5:1 F5:2 E5:2 C#5:4 E5:2 A4:2',
    'D6:2 C6:1 A5:1 F5:2 D5:2 A5:2 F5:1 D5:1 C6:2 A5:2',
    'Bb5:2 A5:1 F5:1 D5:2 F5:2 Bb5:3 C6:1 D6:4',
    'C6:2 Bb5:1 G5:1 E5:2 G5:2 C6:2 E6:2 D6:2 C6:2',
    'C#6:4 A5:2 E5:2 A5:2 C#6:2 E6:4'
  ].join(' ');
  const roots = ['D2', 'Bb1', 'C2', 'A1', 'D2', 'Bb1', 'C2', 'A1'];
  const octs = { D2: 'D3', Bb1: 'Bb2', C2: 'C3', A1: 'A2' };
  let bass = '';
  roots.forEach(r => { const o = octs[r]; bass += `${r}:2 ${r}:1 ${o}:1 ${r}:2 ${o}:2 ${r}:1 ${r}:1 ${o}:2 ${r}:2 ${o}:2 `; });
  const chords = [['D4', 'F4', 'A4', 'D5'], ['Bb3', 'D4', 'F4', 'Bb4'], ['C4', 'E4', 'G4', 'C5'], ['A3', 'C#4', 'E4', 'A4']];
  const arpCh = chords.concat(chords);
  SONGS.battle = {
    bpm: 150, spb: 4, tracks: [
      makeTrack(lead, 'lead', 0.06),
      makeTrack(bass, 'bass', 0.2),
      chordTrack(arpCh, 16, [0, 1, 2, 3, 2, 1, 2, 3], 'arp', 0.018),
      drumTrack(8, 'x.....x.x.....x.', '....x.......x..x', 'x.x.x.x.x.x.x.x.')
    ]
  };
  // "Yıldızlı Ninni" — koridor/son teması (F majör, özgün)
  const mel = [
    'A4:2 C5:2 F5:3 E5:1 D5:2 C5:2 A4:4',
    'Bb4:2 D5:2 G5:3 F5:1 E5:2 D5:2 C5:4',
    'A4:2 C5:2 F5:3 G5:1 A5:2 G5:2 F5:2 D5:2',
    'E5:2 G5:2 C5:2 E5:2 F5:6 R:2'
  ].join(' ');
  const lc = [['F3', 'C4', 'A3', 'C4'], ['C3', 'G3', 'E3', 'G3'], ['Bb2', 'F3', 'D3', 'F3'], ['C3', 'G3', 'E3', 'G3'],
              ['F3', 'C4', 'A3', 'C4'], ['D3', 'A3', 'F3', 'A3'], ['C3', 'G3', 'E3', 'Bb3'], ['F3', 'C4', 'A3', 'F3']];
  SONGS.lullaby = { bpm: 92, spb: 2, tracks: [makeTrack(mel, 'box', 0.09), chordTrack(lc, 8, [0, 1, 2, 3, 0, 1, 2, 3], 'box', 0.035)] };
  const sadMel = 'A4:4 F4:4 D4:4 E4:4 | F4:4 D4:4 A3:8 | Bb3:4 D4:4 F4:4 E4:2 D4:2 | C#4:12 R:4';
  SONGS.sad = { bpm: 60, spb: 2, tracks: [makeTrack(sadMel, 'pad', 0.06)] };
})();
const Music = {
  cur: null, want: null, step: 0, next: 0, timer: null,
  play(name, force) {
    this.want = name;
    if (!Snd.ac) return;
    if (this.cur === name && !force) return;
    this.cur = name; this.step = 0; this.next = Snd.ac.currentTime + 0.08;
    Snd.music.gain.cancelScheduledValues(Snd.ac.currentTime);
    Snd.music.gain.setValueAtTime(0.5, Snd.ac.currentTime);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  stop(fade) {
    this.want = null; this.cur = null;
    if (Snd.ac && fade) { Snd.music.gain.setTargetAtTime(0.0001, Snd.ac.currentTime, fade / 4); }
  },
  tick() {
    if (!Snd.ac || !this.cur) return;
    const song = SONGS[this.cur]; const dur = 60 / song.bpm / song.spb;
    while (this.next < Snd.ac.currentTime + 0.15) {
      for (const tr of song.tracks) {
        const evs = tr.map[this.step % tr.len]; if (!evs) continue;

          if (tr.inst === 'drum') INST[e.d](this.next, 0, dur, e.d === 'kick' ? 0.32 : e.d === 'snare' ? 0.13 : 0.035);

        }

      this.step++; this.next += dur;
    }
  }
};

/* ---------------- Pikseller & Sprite'lar ---------------- */
function makeSprite(map, pal, s) {
  const c = document.createElement('canvas'); c.width = map[0].length * s; c.height = map.length * s;
  const g = c.getContext('2d');
  for (let r = 0; r < map.length; r++) for (let x = 0; x < map[r].length; x++) {
    const ch = map[r][x]; if (ch === '.' || !pal[ch]) continue; g.fillStyle = pal[ch]; g.fillRect(x * s, r * s, s, s);
  }
  return c;
}
const SANS_HEAD = [

function makeSansBody(u) {

function layout(str, font, maxW) {
  ctx.font = font; const lines = [];
  for (const para of str.split('\n')) {
    let star = false, body = para;
    if (para.startsWith('* ')) { star = true; body = para.slice(2); }
    const w = maxW - (star ? 26 : 0);
    const words = body.split(' '); let cur = ''; let first = true;
    for (const wd of words) {
      const test = cur ? cur + ' ' + wd : wd;
      if (ctx.measureText(test).width > w && cur) { lines.push({ star: first && star, ind: star, text: cur }); first = false; cur = wd; }
      else cur = test;
    }
    lines.push({ star: first && star, ind: star, text: cur });
  }
  return lines;
}
function Typer(str, o = {}) {
  const font = o.font || `bold 20px ${FONT}`;
  const lines = layout(str, font, o.maxW || 540);
  const flat = lines.map(l => (l.star ? '*' : '') + l.text).join('');
  return { lines, flat, total: flat.length, n: 0, acc: 0, pause: 0, voice: o.voice || 'nar', speed: o.speed || 34, font, lineH: o.lineH || 30, color: o.color || '#fff', done: flat.length === 0 };
}
function updTyper(ty, dt) {
  if (!ty || ty.done) return;
  if (ty.pause > 0) { ty.pause -= dt; return; }
  ty.acc += dt * ty.speed;
  while (ty.acc >= 1 && !ty.done) {
    ty.acc -= 1; const ch = ty.flat[ty.n]; ty.n++;
    if (ty.n >= ty.total) ty.done = true;
    if (ch && ch !== ' ' && ch !== '*') SFX.blip(ty.voice);
    if (ch && ',.?!…'.includes(ch) && ty.flat[ty.n] !== '.') { ty.pause = ch === ',' ? 0.09 : 0.2; ty.acc = 0; break; }
  }
}

function drawTyper(ty, x, y) {
  if (!ty) return;
  ctx.font = ty.font; ctx.fillStyle = ty.color; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  let left = ty.n;
  for (let i = 0; i < ty.lines.length && left > 0; i++) {
    const l = ty.lines[i]; const ly = y + i * ty.lineH;
    if (l.star) { ctx.fillText('*', x, ly); left--; if (left <= 0) break; }
    const t = l.text.slice(0, left); left -= l.text.length;

}

            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
      capabilities: PICK_CAPABILITIES,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_PICK") {
      const element = resolvePickTarget(event.data.x, event.data.y);
      postToTrustedTop({
        type: "INLINE_EDIT_PICK_RESULT",
        seq: event.data.seq,
        target: element ? describePickTarget(element, event.data.fresh === true) : null,
      });
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_BY") {
      const { deltaX, deltaY, deltaMode } = event.data;
      if (!scrollForwarding || !Number.isFinite(deltaX) || !Number.isFinite(deltaY)) return;
      if (deltaMode !== 0 && deltaMode !== 1 && deltaMode !== 2) return;
      const lineHeight =
        parseFloat(getComputedStyle(document.documentElement).lineHeight) || DEFAULT_LINE_HEIGHT;
      const scaleX = deltaMode === 1 ? lineHeight : deltaMode === 2 ? window.innerWidth : 1;
      const scaleY = deltaMode === 1 ? lineHeight : deltaMode === 2 ? window.innerHeight : 1;
      // The selection overlay receives the wheel event instead of this iframe.
      // Instant scrolling preserves trackpad deltas even on smooth-scroll sites.
      window.scrollBy({ left: deltaX * scaleX, top: deltaY * scaleY, behavior: "instant" });
      emitScroll();
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();


</script></body>
</html>
